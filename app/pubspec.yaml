name: gplx_prep
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  drift: ^2.35.4
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.4
  path: ^1.9.1
  path_provider: ^2.1.6
  # Pinned: 2.3.x goes through package:jni and crashes at startup on Android
  # (ClassNotFoundException "Landroid/content/Context;" in getApplicationSupportDirectory,
  # seen on a Samsung Android 15 phone). 2.2.x uses a platform channel. Revisit when bumping.
  path_provider_android: 2.2.19
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.3
  build_runner: ^2.17.1
  sqlite3: ^3.9.1

flutter:
  uses-material-design: true
  assets:
    - assets/content/
    - assets/content/img/
